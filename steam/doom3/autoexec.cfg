# Console & Intro
# set com_allowconsole "1"
set com_skipIntroVideos "1"

# Settings
set r_mode "-1"
set r_aspectRatio "1"
set r_customWidth "1920"
set r_customHeight "1080"
set r_fullscreen "1"
set com_engineHz "60"
set g_fov 110

# Controls
set in_toggleCrouch "1"
set in_toggleZoom "1"
bind "MOUSE3" "_zoom" # scroll wheel button

# Mouse-centric control scheme, impl TODO:
# bind "MOUSE5" "_jump" # upper side button
# bind "MOUSE4" "_crouch" # lower side button
# bind "MOUSE2" "_sprint" # right button

# Disable Head Bobbing
set pm_runbob "0"
set pm_runpitch "0"
set pm_runroll "0"
set pm_walkbob "0"
set pm_bobpitch "0"
set pm_bobroll "0"
set pm_bobup "0"
set pm_crouchbob "0"

# Visuals & Textures (BFG Engine Valid Commands)
set r_renderer "best"
set com_videoRam "4096"
set com_machineSpec "3"
set r_shadows "1"
set r_skipBump "0"
set r_skipSpecular "0"
set r_skipNewAmbient "0"
set image_anisotropy "8"
set image_filter "GL_LINEAR_MIPMAP_LINEAR"
set image_ignoreHighQuality "0"
set image_roundDown "0"
set image_forceDownSize "0"
set image_downSize "0"
set image_downSizeBump "0"
set image_downSizeSpecular "0"
set image_useCache "0"
set image_usePrecompressedTextures "0"
set image_useNormalCompression "0"
set image_useCompression "0"
set image_useAllFormats "1"
set g_showBrass "1"
set g_decals "1"
set g_doubleVision "1"
set g_bloodEffects "1"
set g_projectileLights "1"
set g_muzzleFlash "1"