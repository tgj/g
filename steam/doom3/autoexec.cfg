# Console & Intro
# seta com_allowconsole "1"
seta com_skipIntroVideos "1"

# Settings
seta r_vidMode "0" # ⚠️CHANGE ME⚠️
seta com_engineHz "120"
seta g_fov "110"

# Controls
seta in_toggleCrouch "1"
seta in_toggleZoom "1"
bind "MOUSE3" "_zoom" # scroll wheel button

# Mouse-centric control scheme, impl TODO:
# bind "MOUSE5" "_jump" # upper side button
# bind "MOUSE4" "_crouch" # lower side button
# bind "MOUSE2" "_sprint" # right button

# Disable Head Bobbing
seta pm_runbob "0"
seta pm_runpitch "0"
seta pm_runroll "0"
seta pm_walkbob "0"
seta pm_bobpitch "0"
seta pm_bobroll "0"
seta pm_bobup "0"
seta pm_crouchbob "0"

# Visuals & Textures (BFG Engine Valid Commands)
seta r_renderer "best"
seta com_videoRam "1024"
seta com_machineSpec "3"
seta r_shadows "1"
seta r_skipBump "0"
seta r_skipSpecular "0"
seta r_skipNewAmbient "0"
seta image_anisotropy "8"
seta image_filter "GL_LINEAR_MIPMAP_LINEAR"
seta image_ignoreHighQuality "0"
seta image_roundDown "0"
seta image_forceDownSize "0"
seta image_downSize "0"
seta image_downSizeBump "0"
seta image_downSizeSpecular "0"
seta image_useCache "0"
seta image_usePrecompressedTextures "0"
seta image_useNormalCompression "0"
seta image_useCompression "0"
seta image_useAllFormats "1"
seta g_showBrass "1"
seta g_decals "1"
seta g_doubleVision "1"
seta g_bloodEffects "1"
seta g_projectileLights "1"
seta g_muzzleFlash "1"